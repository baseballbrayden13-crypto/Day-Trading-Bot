# Sports stats bot on GitHub's computers: free ESPN scores, Elo team ratings and pretend picks. It never bets.
# Each run rates every finished game since the last run, prices today's games against the sportsbook line
# ESPN shows, makes pretend $10 picks, settles old ones and writes sports_data/report.md on the bot-state branch.
# Undo: delete this file (or turn the workflow off in the Actions tab).
name: Cloud sports stats (scores + pretend picks)

on:
  schedule:
    - cron: "20 15 * * *"   # ~10:20am ET: yesterday's scores + morning picks
    - cron: "20 23 * * *"   # ~6:20pm ET: picks for night games once more lines are up
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloud-sports
  cancel-in-progress: false

env:
  FLEET_HOST: cloud
  TZ: America/New_York
  PYTHONPATH: ${{ github.workspace }}/code

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { path: code, ref: "${{ vars.BOT_CODE_REF || github.ref }}" }
      - name: Saved state
        run: bash code/cloud/setup_state.sh
        env: { REPO_URL: "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: code/requirements.txt }
      - run: pip install -r code/requirements.txt
      - name: Sports stats
        working-directory: state
        run: python -m bot.sports_stats
      - name: Save state
        if: always()
        working-directory: state
        run: bash ../code/cloud/save_state.sh "sports stats"
