# Kalshi backtests on GitHub's computers (public data only, no keys, no orders). Run by hand from the
# Actions tab or by Claude. Output lands on the bot-state branch in research/ so it can be read later.
name: Kalshi research (backtests)

on:
  workflow_dispatch:
    inputs:
      args:
        description: "Arguments for python -m bot.kalshi_15m_backtest"
        default: "--days 5 --minutes-before 5"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONPATH: ${{ github.workspace }}/code
    steps:
      - uses: actions/checkout@v4
        with: { path: code }
      - name: Saved state
        run: bash code/cloud/setup_state.sh
        env: { REPO_URL: "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: code/requirements.txt }
      - run: pip install -r code/requirements.txt
      - name: 15-minute markets backtest
        working-directory: state
        env: { ARGS: "${{ inputs.args }}" }
        run: |
          mkdir -p research
          out="research/kalshi_15m_$(date -u +%Y-%m-%d_%H%M).txt"
          echo "args: $ARGS" > "$out"
          python -m bot.kalshi_15m_backtest --list >> "$out" 2>&1 || true
          # shellcheck disable=SC2086
          timeout 270m python -u -m bot.kalshi_15m_backtest $ARGS 2>&1 | tee -a "$out" || true
          cp reports/kalshi_15m_* research/ 2>/dev/null || true
          { echo '```'; tail -60 "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Save results
        if: always()
        working-directory: state
        run: bash ../code/cloud/save_state.sh "kalshi research"
