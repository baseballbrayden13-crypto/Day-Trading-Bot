# Lab (Saturday) and Reporter (Sunday) on GitHub's computers. Both are read-only: Lab re-tests each
# strategy on fresh data and runs one queued experiment; Reporter writes the weekly report card.
# Results land on the bot-state branch (fleet_data/lab.md, lab.csv, weekly_<date>.md, report_card.csv).
name: Cloud weekly helpers

on:
  schedule:
    - cron: "0 14 * * 6"    # Lab: Saturday 10am EDT / 9am EST
    - cron: "30 22 * * 0"   # Reporter: Sunday 6:30pm EDT / 5:30pm EST
  workflow_dispatch:
    inputs:
      what:
        description: "What to run"
        type: choice
        options: [lab, reporter]
        default: reporter

permissions:
  contents: write

concurrency:
  group: cloud-weekly
  cancel-in-progress: false

jobs:
  run:
    if: vars.BOT1_CLOUD == 'on'  # until bot 1 moves, the PC runs Lab and Reporter
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      FLEET_HOST: cloud
      TZ: America/New_York
      PYTHONPATH: ${{ github.workspace }}/code
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
          ref: ${{ vars.BOT_CODE_REF || github.ref }}

      - name: Saved state and keys (keys are never saved)
        run: bash code/cloud/setup_state.sh
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
          BOT1_ENV: ${{ secrets.BOT1_ENV }}
          BOT1_CLOUD: ${{ vars.BOT1_CLOUD }}
          BOT2_KEY: ${{ secrets.BOT2_ALPACA_API_KEY }}
          BOT2_SECRET: ${{ secrets.BOT2_ALPACA_SECRET_KEY }}
          BOT3_KEY: ${{ secrets.BOT3_ALPACA_API_KEY }}
          BOT3_SECRET: ${{ secrets.BOT3_ALPACA_SECRET_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements.txt

      - run: pip install -r code/requirements.txt

      - name: Lab or Reporter
        id: pick
        working-directory: state
        run: |
          what="${{ inputs.what }}"
          [ -z "$what" ] && { [ "${{ github.event.schedule }}" = "0 14 * * 6" ] && what=lab || what=reporter; }
          echo "what=$what" >> "$GITHUB_OUTPUT"
          python -m bot.$what

      - name: Save state
        if: always()
        working-directory: state
        run: |
          rm -f .env .env.rotation .env.crypto
          bash ../code/cloud/save_state.sh "${{ steps.pick.outputs.what }}"
