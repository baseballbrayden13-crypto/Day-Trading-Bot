# Sports odds finder on GitHub's computers: alerts and pretend bets only, it never bets.
# Each run settles finished pretend bets (ESPN scores and Kalshi results, free), then, if the
# ODDS_API_KEY secret is set, checks today's moneyline odds (The Odds API free plan, 500 credits a month;
# the bot spreads them over the month) against each other and Kalshi. Results go to the bot-state branch:
# odds_data/summary.json, finds.csv, paper_bets.csv and odds_state.json; finds also land in fleet_data/alerts.csv.
# Undo: delete this file (or turn the workflow off in the Actions tab).
name: Cloud odds finder (alerts + pretend bets)

on:
  schedule:
    # Hourly: GitHub often runs crons hours late or skips them, so the bot itself decides when to spend
    # credits (each sport re-priced at most every 2.5h, nothing 1am-8am ET, daily credit allowance).
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      args:
        description: "Extra arguments (--settle = no credits used)"
        default: ""

permissions:
  contents: write

concurrency:
  group: cloud-odds
  cancel-in-progress: false

env:
  FLEET_HOST: cloud
  TZ: America/New_York
  PYTHONPATH: ${{ github.workspace }}/code

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { path: code, ref: "${{ vars.BOT_CODE_REF || github.ref }}" }
      - name: Saved state
        run: bash code/cloud/setup_state.sh
        env: { REPO_URL: "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: code/requirements.txt }
      - run: pip install -r code/requirements.txt
      - name: Odds finder
        working-directory: state
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NTFY_TOPIC: ${{ secrets.ODDS_NTFY_TOPIC }}
          ARGS: ${{ inputs.args }}
        run: python -m bot.odds_finder $ARGS
      # Player props forward test: pretend bets only, never an order, not part of bots 4e/4f.
      # Uses up to 6 of the Odds API credits a day. Undo: set KALSHI_PROPS to "off".
      - name: Kalshi player props (pretend)
        if: always()
        continue-on-error: true
        working-directory: state
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          KALSHI_PROPS: "on"
          KALSHI_PROPS_CREDITS: "6"
        run: python -m bot.kalshi_props --scan
      - name: Save state
        if: always()
        working-directory: state
        run: bash ../code/cloud/save_state.sh "odds finder"
