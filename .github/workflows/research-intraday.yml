# Bot 1 research on GitHub's computers: its ORB settings (from the BOT1_ENV secret) run on each of ~45
# symbols with 3 years of 5-minute bars. Market data only, no orders. The report is saved on the
# research-results branch (and printed in the log). Runs when this file changes on its branch, or by hand.
name: Research (bot 1 symbol scan)

on:
  workflow_dispatch:
  push:
    branches: [claude/research-data-fetch]
    paths: [.github/workflows/research-intraday.yml, bot/symbol_scan.py, bot/next_tests.py]

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONPATH: ${{ github.workspace }}/code
      TZ: America/New_York
      ENTRY_LIMIT_BPS: "5"  # as bot 1 trades now (C-038)
    steps:
      - uses: actions/checkout@v4
        with: { path: code }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: code/requirements.txt }
      - run: pip install -r code/requirements.txt
      - name: Scan
        env:
          BOT1_ENV: ${{ secrets.BOT1_ENV }}
        run: |
          mkdir -p work && cd work
          umask 077; printf '%s\n' "$BOT1_ENV" > .env
          timeout 280m python -u -m bot.next_tests --days 1095 || true  # Nov 10: exits + big tech (symbol scan: see Nov 5 report)
          rm -f .env
      - name: Save report
        if: always()
        run: |
          cd work; [ -d reports ] || exit 0
          git clone -q --depth 1 --branch research-results "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" res 2>/dev/null \
            || { mkdir res && cd res && git init -q -b research-results && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" && cd ..; }
          cp reports/*.md res/
          cd res && git config user.name research-bot && git config user.email research-bot@users.noreply.github.com
          git add -A && git commit -qm "Bot 1 tests $(date -u +%F)" && git push -q origin HEAD:research-results
