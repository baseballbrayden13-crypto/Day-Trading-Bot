# Bot 1 (ORB day trader) and Guard on GitHub's computers, so they run even when the PC is off.
# A job can run at most 6 hours, so the trading day is two runs: morning (start by 12:00, stop 12:38 ET)
# and afternoon (start 12:00-15:50, stop 16:05 ET). Each slot has two crons, one for summer time and
# one for winter time; the one that lands outside its ET start window exits in seconds. The concurrency
# group makes the afternoon run wait for the morning one, so there is never more than one bot 1.
# Paper only. Its .env (settings + keys) comes from the BOT1_ENV secret. Off until the repository
# variable BOT1_CLOUD is 'on' (python set_cloud_keys.py --move-bot1), so it never runs alongside the PC's bot 1.
name: Cloud bot 1 (paper)

on:
  schedule:
    - cron: "5 13 * * 1-5"   # morning: 9:05am EDT (8:05am EST: outside its window, exits)
    - cron: "5 14 * * 1-5"   # morning: 9:05am EST (10:05am EDT: waits behind the 9:05 run, then exits)
    - cron: "35 16 * * 1-5"  # afternoon: 12:35pm EDT (11:35am EST: exits)
    - cron: "35 17 * * 1-5"  # afternoon: 12:35pm EST (1:35pm EDT: waits, then exits)
  workflow_dispatch:
    inputs:
      part:
        description: "Which part of the day"
        type: choice
        options: [auto, morning, afternoon]
        default: auto

permissions:
  contents: write  # to save state on the bot-state branch

concurrency:
  group: cloud-bot1  # one bot 1 at a time
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      FLEET_HOST: cloud
      TZ: America/New_York
      PYTHONPATH: ${{ github.workspace }}/code
      BOT1_ACCOUNT: ${{ vars.BOT1_ACCOUNT }}
    steps:
      - name: Which part of the day
        id: part
        run: |
          part="${{ inputs.part }}"
          if [ -z "$part" ] || [ "$part" = auto ]; then
            case "${{ github.event.schedule }}" in
              "5 13 * * 1-5"|"5 14 * * 1-5") part=morning ;;
              "35 16 * * 1-5"|"35 17 * * 1-5") part=afternoon ;;
              *) [ "$(date +%H%M)" -lt 1200 ] && part=morning || part=afternoon ;;
            esac
          fi
          if [ "$part" = morning ]; then echo "window=08:30-12:00" >> "$GITHUB_OUTPUT"; echo "until=12:38" >> "$GITHUB_OUTPUT"
          else echo "window=12:00-15:50" >> "$GITHUB_OUTPUT"; echo "until=16:05" >> "$GITHUB_OUTPUT"; fi
          echo "part=$part" >> "$GITHUB_OUTPUT"

      - name: Too early or too late?
        id: go
        run: |
          w="${{ steps.part.outputs.window }}"; now=$(date +%H:%M)
          if [ "${{ vars.BOT1_CLOUD }}" != on ]; then echo "Bot 1 still runs on the PC (repository variable BOT1_CLOUD isn't 'on')."; echo "run=no" >> "$GITHUB_OUTPUT"
          elif [[ "$now" > "${w%-*}" || "$now" == "${w%-*}" ]] && [[ "$now" < "${w#*-}" ]]; then echo "run=yes" >> "$GITHUB_OUTPUT"
          else echo "It's $now ET, outside the ${{ steps.part.outputs.part }} window $w. Nothing to do."; echo "run=no" >> "$GITHUB_OUTPUT"; fi

      - name: Code
        if: steps.go.outputs.run == 'yes'
        uses: actions/checkout@v4
        with:
          path: code
          ref: ${{ vars.BOT_CODE_REF || github.ref }}

      - name: Saved state and keys (keys are never saved)
        if: steps.go.outputs.run == 'yes'
        run: bash code/cloud/setup_state.sh
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
          BOT1_ENV: ${{ secrets.BOT1_ENV }}
          BOT1_CLOUD: ${{ vars.BOT1_CLOUD }}
          BOT2_KEY: ${{ secrets.BOT2_ALPACA_API_KEY }}
          BOT2_SECRET: ${{ secrets.BOT2_ALPACA_SECRET_KEY }}
          BOT3_KEY: ${{ secrets.BOT3_ALPACA_API_KEY }}
          BOT3_SECRET: ${{ secrets.BOT3_ALPACA_SECRET_KEY }}

      - uses: actions/setup-python@v5
        if: steps.go.outputs.run == 'yes'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements.txt

      - name: Install
        if: steps.go.outputs.run == 'yes'
        run: pip install -r code/requirements.txt

      - name: Bot 1 + Guard (state and site chart data saved every 30 minutes)
        if: steps.go.outputs.run == 'yes'
        working-directory: state
        run: |
          test -s .env || { echo "No BOT1_ENV secret yet: run 'Copy keys to GitHub.bat' on the PC."; exit 1; }
          python -m bot.guard --loop 10 --until "${{ steps.part.outputs.until }}" > guard.out 2>&1 &
          guard=$!
          (while sleep 1800; do python -m bot.site_data > site_data.out 2>&1 || true; bash ../code/cloud/save_state.sh "bot1 checkpoint" || true; done) &
          saver=$!
          python -m bot.live --start-window "${{ steps.part.outputs.window }}" --until "${{ steps.part.outputs.until }}"
          kill $saver 2>/dev/null || true
          wait $guard 2>/dev/null || true
          tail -5 guard.out

      - name: Save state
        if: always() && steps.go.outputs.run == 'yes'
        working-directory: state
        run: |
          python -m bot.site_data > site_data.out 2>&1 || true
          rm -f .env .env.rotation .env.crypto
          bash ../code/cloud/save_state.sh "bot1 ${{ steps.part.outputs.part }}"
