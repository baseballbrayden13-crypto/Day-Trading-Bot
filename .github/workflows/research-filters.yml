# Free-data filter research (Nov 10 2026): fetches earnings dates, FOMC/CPI/jobs days, crypto fear & greed and
# funding rates, and bot 1's 3-year ORB trade log, then saves them on the research-data branch under filters/.
# Market data and public pages only, no orders.
name: Research (free-data filters)

on:
  workflow_dispatch:
  push:
    branches: [claude/research-data-fetch]
    paths: [.github/workflows/research-filters.yml, bot/filter_data.py]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: ${{ github.workspace }}/code
      TZ: America/New_York
      ENTRY_LIMIT_BPS: "5"
      SYMBOLS: "SPY,QQQ,AAPL,MSFT,NVDA,TSLA"
    steps:
      - uses: actions/checkout@v4
        with: { path: code }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: code/requirements.txt }
      - run: pip install -r code/requirements.txt yfinance lxml
      - name: Fetch
        env:
          BOT1_ENV: ${{ secrets.BOT1_ENV }}
        run: |
          mkdir -p work && cd work
          umask 077; printf '%s\n' "$BOT1_ENV" > .env
          python -u -m bot.filter_data --out ../out --only news,bot1 || true
          rm -f .env
          ls -la ../out
      - name: Save to research-data branch
        if: always()
        run: |
          git clone -q --depth 1 --branch research-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" res
          mkdir -p res/filters && cp out/news.csv res/filters/ 2>/dev/null; cp out/bot1_trades.csv res/filters/bot1_trades_tsla.csv 2>/dev/null || true
          cd res && git config user.name research-bot && git config user.email research-bot@users.noreply.github.com
          git add -A && git commit -qm "Filter data $(date -u +%F)" && git push -q origin HEAD:research-data
