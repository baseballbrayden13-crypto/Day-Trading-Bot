# Bots 2 and 3, Scout and Medic on GitHub's computers, so they run even when the PC is off.
# Paper accounts only. Keys come from repository secrets (python set_cloud_keys.py puts them there);
# each bot's state, logs and Medic's reports are saved on the bot-state branch after every run.
name: Cloud bots (paper)

on:
  schedule:
    - cron: "52 13 * * 1-5"  # bots 2, 5 and 6: 9:52am EDT (8:52am EST: market closed, it waits for the next run)
    - cron: "52 14 * * 1-5"  # bot 2: 9:52am EST / 10:52am EDT (rebalances only once a month either way)
    - cron: "30 15 * * 1-5"  # backup for bots 2, 5 and 6 (GitHub dropped both morning crons on Nov 10, C-059); each runs once a day
    - cron: "20 0 * * *"     # bot 3 at ~8:20pm EDT / 7:20pm EST (after the UTC daily bar), then Scout + Medic
  workflow_dispatch:
    inputs:
      what:
        description: "What to run"
        type: choice
        options: [bot2, bot3, medic, all, kalshi-scan]
        default: medic

permissions:
  contents: write  # to save state on the bot-state branch

concurrency:
  group: cloud-bots  # bot 1 and the weekly helpers have their own groups; save_state.sh handles races
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLEET_HOST: cloud
      TZ: America/New_York  # log times in ET, like on the PC
      PYTHONPATH: ${{ github.workspace }}/code
      BOT1_ACCOUNT: ${{ vars.BOT1_ACCOUNT }}  # bots 2 and 3 refuse to run on bot 1's account
    steps:
      - name: Code
        uses: actions/checkout@v4
        with:
          path: code
          ref: ${{ vars.BOT_CODE_REF || github.ref }}

      - name: Saved state and keys (keys are never saved)
        run: bash code/cloud/setup_state.sh
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
          BOT2_STATE: ${{ vars.BOT2_STATE }}
          BOT1_ENV: ${{ secrets.BOT1_ENV }}
          BOT1_CLOUD: ${{ vars.BOT1_CLOUD }}
          BOT2_KEY: ${{ secrets.BOT2_ALPACA_API_KEY }}
          BOT2_SECRET: ${{ secrets.BOT2_ALPACA_SECRET_KEY }}
          BOT3_KEY: ${{ secrets.BOT3_ALPACA_API_KEY }}
          BOT3_SECRET: ${{ secrets.BOT3_ALPACA_SECRET_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements.txt

      - name: Install
        run: pip install -r code/requirements.txt

      - name: Pick what runs
        id: pick
        run: |
          what="${{ inputs.what }}"
          if [ -z "$what" ]; then
            case "${{ github.event.schedule }}" in
              "20 0 * * *") what=night ;;
              *) what=bot2 ;;
            esac
          fi
          echo "what=$what" >> "$GITHUB_OUTPUT"

      - name: Bot 2 (ETF rotation)
        if: contains(fromJSON('["bot2","all"]'), steps.pick.outputs.what)
        working-directory: state
        env:
          # Bots 2 and 5 share account ...8T7Y (bot.sleeves): half each of the ~$4,940 account, $2,450 apiece (C-039).
          # Undo: delete this line and bot 5's step; bot 2 goes back to trading the whole account.
          SLEEVES: "2=2450,5=2450"
        run: python -m bot.rotation_live

      - name: Bot 5 (big-stock dip buyer, shares bot 2's account)
        if: always() && contains(fromJSON('["bot2","all"]'), steps.pick.outputs.what)
        working-directory: state
        env:
          SLEEVES: "2=2450,5=2450"
        run: cp .env.rotation .env.dipbuy && python -m bot.dipbuy_live

      - name: Bot 6 (QQQ trend, shares bot 3's account)
        if: always() && contains(fromJSON('["bot2","all"]'), steps.pick.outputs.what)
        working-directory: state
        env:
          # Bots 3 and 6 share account ...KTS7 (bot.sleeves): $2,500 each of the $5,000 account (C-055).
          # Undo: delete this step and the two SLEEVES lines on bot 3; bot 3 goes back to the whole account.
          SLEEVES: "3=2500,6=2500"
          SLEEVES_FILE: sleeves_kts7.json
        run: cp .env.crypto .env.trend && python -m bot.trend_live

      - name: Bot 3 (crypto trend)
        if: contains(fromJSON('["bot3","night","all"]'), steps.pick.outputs.what)
        working-directory: state
        env:
          SLEEVES: "3=2500,6=2500"
          SLEEVES_FILE: sleeves_kts7.json
        run: python -m bot.crypto_live

      - name: Bot 3b (pretend copy with the fear & greed rule, no orders)
        if: always() && contains(fromJSON('["bot3","night","all"]'), steps.pick.outputs.what)
        working-directory: state
        run: python -m bot.crypto_shadow || echo "Bot 3b skipped today"

      - name: Scout + Medic
        if: always() && contains(fromJSON('["medic","night","all"]'), steps.pick.outputs.what)
        working-directory: state
        run: python -m bot.maintenance --collect

      - name: Army fund (pretend money that follows the winning bots, no orders)
        if: always() && contains(fromJSON('["medic","night","all"]'), steps.pick.outputs.what)
        working-directory: state
        run: python -m bot.army_fund || echo "Army fund skipped today"  # C-056; undo: delete this step

      - name: Kalshi reachability test (read-only scan, nothing saved)
        if: steps.pick.outputs.what == 'kalshi-scan'
        working-directory: ${{ runner.temp }}
        run: timeout 600 python -m bot.kalshi_live --scan | tail -20

      - name: Save state
        if: always()
        working-directory: state
        run: |
          rm -f .env .env.rotation .env.crypto .env.dipbuy .env.trend
          bash ../code/cloud/save_state.sh "${{ steps.pick.outputs.what }}"
