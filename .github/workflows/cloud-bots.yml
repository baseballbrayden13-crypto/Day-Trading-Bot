# Bots 2 and 3, Scout and Medic on GitHub's computers, so they run even when the PC is off.
# Paper accounts only. Keys come from repository secrets (python set_cloud_keys.py puts them there);
# each bot's state, logs and Medic's reports are saved on the bot-state branch after every run.
name: Cloud bots (paper)

on:
  schedule:
    - cron: "52 13 * * 1-5"  # bot 2: 9:52am EDT (8:52am EST: market closed, it waits for the next run)
    - cron: "52 14 * * 1-5"  # bot 2: 9:52am EST / 10:52am EDT (rebalances only once a month either way)
    - cron: "20 0 * * *"     # bot 3 at ~8:20pm EDT / 7:20pm EST (after the UTC daily bar), then Scout + Medic
  workflow_dispatch:
    inputs:
      what:
        description: "What to run"
        type: choice
        options: [bot2, bot3, medic, all]
        default: medic

permissions:
  contents: write  # to save state on the bot-state branch

concurrency:
  group: cloud-bots  # never two runs writing the state branch at once
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLEET_HOST: cloud
      PYTHONPATH: ${{ github.workspace }}/code
      BOT1_ACCOUNT: ${{ vars.BOT1_ACCOUNT }}  # bots 2 and 3 refuse to run on bot 1's account
    steps:
      - name: Code
        uses: actions/checkout@v4
        with:
          path: code
          ref: ${{ vars.BOT_CODE_REF || github.ref }}

      - name: Saved state (bot-state branch)
        run: |
          if git ls-remote --exit-code --heads "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" bot-state; then
            git clone --depth 1 --branch bot-state "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" state
          else
            mkdir state && cd state && git init -b bot-state && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          fi
          cp code/cloud/gitignore state/.gitignore
          cp code/cloud/fleet.json state/fleet.json
          if [ ! -f state/rotation_state.json ] && [ -n "$BOT2_STATE" ]; then echo "$BOT2_STATE" > state/rotation_state.json; fi
        env:
          BOT2_STATE: ${{ vars.BOT2_STATE }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements.txt

      - name: Install
        run: pip install -r code/requirements.txt

      - name: Pick what runs
        id: pick
        run: |
          what="${{ inputs.what }}"
          if [ -z "$what" ]; then
            case "${{ github.event.schedule }}" in
              "20 0 * * *") what=night ;;
              *) what=bot2 ;;
            esac
          fi
          echo "what=$what" >> "$GITHUB_OUTPUT"

      - name: Keys (from secrets, never saved)
        working-directory: state
        run: |
          umask 077
          printf 'ALPACA_API_KEY=%s\nALPACA_SECRET_KEY=%s\n' "${{ secrets.BOT2_ALPACA_API_KEY }}" "${{ secrets.BOT2_ALPACA_SECRET_KEY }}" > .env.rotation
          printf 'ALPACA_API_KEY=%s\nALPACA_SECRET_KEY=%s\n' "${{ secrets.BOT3_ALPACA_API_KEY }}" "${{ secrets.BOT3_ALPACA_SECRET_KEY }}" > .env.crypto

      - name: Bot 2 (ETF rotation)
        if: contains(fromJSON('["bot2","all"]'), steps.pick.outputs.what)
        working-directory: state
        run: python -m bot.rotation_live

      - name: Bot 3 (crypto trend)
        if: contains(fromJSON('["bot3","night","all"]'), steps.pick.outputs.what)
        working-directory: state
        run: python -m bot.crypto_live

      - name: Scout + Medic
        if: always() && contains(fromJSON('["medic","night","all"]'), steps.pick.outputs.what)
        working-directory: state
        run: python -m bot.maintenance --collect

      - name: Save state
        if: always()
        working-directory: state
        run: |
          rm -f .env.rotation .env.crypto
          git config user.name "cloud-bots"
          git config user.email "cloud-bots@users.noreply.github.com"
          git add -A
          git commit -qm "Cloud run ${{ steps.pick.outputs.what }} $(date -u +%FT%TZ)" || exit 0
          git push -q origin HEAD:bot-state
