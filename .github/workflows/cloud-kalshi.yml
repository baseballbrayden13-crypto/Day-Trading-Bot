# Kalshi paper bots on GitHub's computers: bot 4 (locked-in baskets on real prices, pretend $20) and
# bot 4c (maker quotes on real prices, pretend $20). Neither uses keys or places real orders.
# A job can run at most 6 hours, so each bot runs in ~5h45m chunks started every 6 hours; its own
# concurrency group makes sure two chunks of the same bot never overlap. State (positions, pretend
# fills) is saved on the bot-state branch every 30 minutes and at the end of each chunk, and the next
# chunk carries on from it. The demo maker (4b) needs a Kalshi key, so it stays on the PC.
name: Cloud Kalshi bots (paper)

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long this chunk runs"
        default: "345"

permissions:
  contents: write

env:
  FLEET_HOST: cloud
  TZ: America/New_York
  PYTHONPATH: ${{ github.workspace }}/code
  KALSHI_PRICE_LOG: "off"

jobs:
  bot4:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency: { group: cloud-kalshi-4, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { path: code, ref: "${{ vars.BOT_CODE_REF || github.ref }}" }
      - name: Saved state
        run: bash code/cloud/setup_state.sh
        env: { REPO_URL: "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: code/requirements.txt }
      - run: pip install -r code/requirements.txt
      - name: Bot 4 (a sweep every 5 minutes)
        working-directory: state
        run: |
          end=$(( $(date +%s) + ${{ inputs.minutes || 345 }} * 60 ))
          last_save=$(date +%s)
          while [ $(( end - $(date +%s) )) -gt 120 ]; do
            start=$(date +%s)
            timeout 900 python -m bot.kalshi_live --paper || echo "sweep exited $? (next sweep carries on)"
            if [ $(( $(date +%s) - last_save )) -ge 1800 ]; then bash ../code/cloud/save_state.sh "kalshi 4 checkpoint" || true; last_save=$(date +%s); fi
            wait=$(( 300 - ($(date +%s) - start) )); [ $wait -gt 0 ] && sleep $wait
          done
      - name: Save state
        if: always()
        working-directory: state
        run: bash ../code/cloud/save_state.sh "kalshi 4"

  bot4c:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency: { group: cloud-kalshi-4c, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { path: code, ref: "${{ vars.BOT_CODE_REF || github.ref }}" }
      - name: Saved state
        run: bash code/cloud/setup_state.sh
        env: { REPO_URL: "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: code/requirements.txt }
      - run: pip install -r code/requirements.txt
      - name: Bot 4c (maker paper; restarted if its watchdog trips)
        working-directory: state
        run: |
          end=$(( $(date +%s) + ${{ inputs.minutes || 345 }} * 60 ))
          (while sleep 1800; do bash ../code/cloud/save_state.sh "kalshi 4c checkpoint" || true; done) &
          saver=$!
          while :; do
            left=$(( (end - $(date +%s)) / 60 ))
            [ $left -lt 3 ] && break
            python -m bot.kalshi_maker --paper --minutes $left && break
            code=$?; echo "maker exited $code; restarting in 30s"; sleep 30
          done
          kill $saver 2>/dev/null || true
      - name: Save state
        if: always()
        working-directory: state
        run: bash ../code/cloud/save_state.sh "kalshi 4c"
