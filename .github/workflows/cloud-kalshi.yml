# Kalshi paper bots on GitHub's computers (pretend $20 each, real prices, no keys, no real orders):
# bot 4e is THE Kalshi bot: resting-bid maker (10 quotes, markets with 25+ contracts a day, $5 per quote) plus
# the instant locked-in scan (old bot 4, same loop) plus one pretend "safest" bet a day ($1 on a 95-98c
# favorite closing within 24h, own record). The minimum profit stays $0.10. Bot 4c is the old maker with
# the earlier settings; it stays only until its open baskets settle (Nov 7). The standalone bot 4 job was
# retired (4e does its scan); its records stay on bot-state.
# A job can run at most 6 hours, so each bot runs in ~5h45m chunks started every 6 hours; its own
# concurrency group makes sure two chunks of the same bot never overlap. State (positions, pretend
# fills) is saved on the bot-state branch every 30 minutes and at the end of each chunk, and the next
# chunk carries on from it.
name: Cloud Kalshi bots (paper)

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long this chunk runs"
        default: "345"

permissions:
  contents: write

env:
  FLEET_HOST: cloud
  TZ: America/New_York
  PYTHONPATH: ${{ github.workspace }}/code
  KALSHI_PRICE_LOG: "off"

jobs:
  bot4c:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency: { group: cloud-kalshi-4c, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { path: code, ref: "${{ vars.BOT_CODE_REF || github.ref }}" }
      - name: Saved state
        run: bash code/cloud/setup_state.sh
        env: { REPO_URL: "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: code/requirements.txt }
      - run: pip install -r code/requirements.txt
      - name: Bot 4c (maker paper; restarted if its watchdog trips)
        working-directory: state
        run: |
          python ../code/cloud/merge_carryover.py  # one-time: adds the PC copy's open baskets (no-op after the first run)
          end=$(( $(date +%s) + ${{ inputs.minutes || 345 }} * 60 ))
          (while sleep 1800; do bash ../code/cloud/save_state.sh "kalshi 4c checkpoint" || true; done) &
          saver=$!
          while :; do
            left=$(( (end - $(date +%s)) / 60 ))
            [ $left -lt 3 ] && break
            python -m bot.kalshi_maker --paper --minutes $left && break
            code=$?; echo "maker exited $code; restarting in 30s"; sleep 30
          done
          kill $saver 2>/dev/null || true
      - name: Save state
        if: always()
        working-directory: state
        run: bash ../code/cloud/save_state.sh "kalshi 4c"

  bot4e:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency: { group: cloud-kalshi-4e, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { path: code, ref: "${{ vars.BOT_CODE_REF || github.ref }}" }
      - name: Saved state
        run: bash code/cloud/setup_state.sh
        env: { REPO_URL: "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: code/requirements.txt }
      - run: pip install -r code/requirements.txt
      - name: Bot 4e, the combined Kalshi bot (maker + taker scan + safest bet; restarted if its watchdog trips)
        working-directory: state
        env:
          KALSHI_VARIANT: wide
          KALSHI_MAX_QUOTES: "10"
          KALSHI_MIN_VOLUME: "25"
          KALSHI_MAX_PER_QUOTE: "5"
          KALSHI_SAFEST: "on"
        run: |
          end=$(( $(date +%s) + ${{ inputs.minutes || 345 }} * 60 ))
          (while sleep 1800; do bash ../code/cloud/save_state.sh "kalshi 4e checkpoint" || true; done) &
          saver=$!
          while :; do
            left=$(( (end - $(date +%s)) / 60 ))
            [ $left -lt 3 ] && break
            python -m bot.kalshi_maker --paper --minutes $left && break
            code=$?; echo "maker exited $code; restarting in 30s"; sleep 30
          done
          kill $saver 2>/dev/null || true
      - name: Save state
        if: always()
        working-directory: state
        run: bash ../code/cloud/save_state.sh "kalshi 4e"
